# Apache 2.4 + Node.js. Enable proxy_module, proxy_http_module and headers_module.
# Replace paths with the extracted Node installation directory.
# Remove the old PHP Alias/Rewrite rules for /vengg4 before enabling this file.
ProxyRequests Off
ProxyPreserveHost On
ProxyPass /vengg4/api http://127.0.0.1:3000/api retry=0
ProxyPassReverse /vengg4/api http://127.0.0.1:3000/api

Alias /vengg4 "C:/Vengg4/frontend/dist"
<Directory "C:/Vengg4/frontend/dist">
    Options -Indexes
    AllowOverride None
    Require local
    DirectoryIndex index.html
    FallbackResource /vengg4/index.html
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://ui-avatars.com; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    <Files "index.html">
        Header always set Cache-Control "no-store"
    </Files>
</Directory>

# Inside an HTTPS VirtualHost only, set the header below and use production .env:
# RequestHeader set X-Forwarded-Proto "https"
# Header always set Strict-Transport-Security "max-age=31536000"
# Keep Node bound to 127.0.0.1. Never forward the old PHP API alongside Node.
